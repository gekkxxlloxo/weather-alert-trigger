name: 叫醒天气预警

# 这个仓库存在的唯一原因：
# 私有仓库 drive-weather-alert 自己的 cron 实测不触发（连一次性 cron 都不跑），
# 而公开仓库的 cron 是可靠的（同账号的 ruls 每天稳定触发）。
# 所以由这个公开仓库定时去「叫醒」私有仓库的预警 workflow。
# 本仓库是公开的，但令牌放在 Actions Secrets 里，不会泄露。

on:
  schedule:
    # 2026-10-31 实测结论：本仓库原来每天约 32 班，schedule 触发数为 0；
    # 而同账号的 ruls 仓库「每天 1 次」连续 5 天 100% 被调度（延迟 0~38 分钟）。
    # → 高频 cron 会被丢弃，低频才可靠。故压到每天 1 班：
    #   UTC 23:37 = 北京 07:37，与私有仓库自己的北京 07:07 错开半小时，互为平行验证。
    - cron: '37 23 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 触发私有仓库的预警检测
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: weather-alert-trigger" \
            https://api.github.com/repos/gekkxxlloxo/drive-weather-alert/dispatches \
            -d '{"event_type":"location-update"}')
          echo "GitHub 返回 HTTP $code"
          if [ "$code" != "204" ]; then
            echo "::error::叫醒失败，HTTP $code"
            exit 1
          fi
